[package]
name = "autoquill"
version = "0.19.0-beta.1"
edition = "2024"
rust-version = "1.97"
description = "A compact, cross-platform automatic typing assistant"
homepage = "https://jivaro.net"
repository = "https://github.com/officialjivaro/rust-autoquill"
publish = false
build = "build.rs"

[package.metadata.winresource]
ProductName = "AutoQuill"
CompanyName = "Jivaro LLC"
FileDescription = "AutoQuill automatic typing assistant"
OriginalFilename = "AutoQuill.exe"
LegalCopyright = "Copyright (c) 2026 Jivaro LLC"

[features]
default = ["renderer-software"]
renderer-femtovg = ["slint/renderer-femtovg"]
renderer-software = ["slint/renderer-software"]

[dependencies]
# Pin below 0.3.10: its build script attempted an unexpected executable download during a clean build.
arrayref = "=0.3.9"
copypasta = "=0.10.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
slint = { version = "=1.17.1", default-features = false, features = [
    "accessibility",
    "backend-winit",
    "compat-1-2",
    "std",
    "system-tray",
] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "=0.6.1", default-features = false, features = ["x11rb"] }
global-hotkey = { version = "=0.8.0", default-features = false }
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }
x11rb = "=0.13.2"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd = { version = "=0.17.2", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
enigo = { version = "=0.6.1", default-features = false }
global-hotkey = { version = "=0.8.0", default-features = false }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
    "NSRunningApplication",
    "NSWorkspace",
    "libc",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "=1.17.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "=0.1.31"

[dev-dependencies]
i-slint-backend-testing = "=1.17.1"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

[profile.release-size]
inherits = "release"
opt-level = "z"

# Keep local development artifacts manageable on storage-constrained machines. AutoQuill's
# automated checks do not need large PDBs or duplicated incremental object caches.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
