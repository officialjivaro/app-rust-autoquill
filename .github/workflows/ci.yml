name: Rust CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "build.rs"
      - "assets/**"
      - "src/**"
      - "tests/**"
      - "ui/**"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "build.rs"
      - "assets/**"
      - "src/**"
      - "tests/**"
      - "ui/**"
  workflow_dispatch:
    inputs:
      platform_builds:
        description: "Compile macOS ARM/Intel and Linux release targets"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Windows format, lint, and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --no-default-features --features renderer-software -- -D warnings
      - name: Test
        run: cargo test --no-default-features --features renderer-software

  platform-build:
    name: Compile only / ${{ matrix.os }}
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.platform_builds) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[platform ci]'))
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libwayland-dev libxkbcommon-dev
      - name: Build native size-focused release
        run: cargo build --profile release-size --locked --no-default-features --features renderer-software
      - name: Add Intel macOS target
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin
      - name: Type-check Intel macOS target
        if: runner.os == 'macOS'
        run: cargo check --locked --target x86_64-apple-darwin --no-default-features --features renderer-software
